name: icesat2
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.12
  - gdal=3
  - geopandas=1
  - matplotlib=3
  - numpy=2
  - pandas>=2
  - pytmd=3
  - h5py
  - scipy
  - shapely
  - netcdf4
  - libnetcdf          # explicit native lib — ensures consistent resolution
  - libjpeg-turbo      # provides libjpeg.8.dylib, required by libnetcdf on macOS
  - tqdm
  - pyarrow
  - xarray
  - rioxarray
  - duckdb
  - dask
  - zarr
  - rasterio
  - requests
  - harmony-py
  - polars
prefix: ~/.miniconda3/envs/icesat2
