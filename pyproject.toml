[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "icesat2"
version = "0.1.0"
description = "An ICESat-2 download and analysis package"
dependencies = [
    "numpy"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.format]
quote-style = "single"
